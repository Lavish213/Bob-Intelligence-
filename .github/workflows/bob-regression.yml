name: Bob contracts and database recovery
on:
  pull_request:
  push:
    branches: [master, repair/bob-integration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked
      - run: uv run pytest --cov=backend --cov-branch -q
      - run: uv run ruff check backend tests scripts/benchmark_valuation.py
      - run: npm ci --prefix tests --ignore-scripts --no-audit --no-fund
      - run: npm run test:database --prefix tests
      - run: git diff --check
  valuation-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --extra valuation-research
      - run: uv run --extra valuation-research pytest tests/test_market_research.py -q
      - run: uv run --extra valuation-research ruff check backend tests scripts
