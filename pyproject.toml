[project]
name = "bob-intelligence"
version = "2.0.0"
requires-python = ">=3.11,<3.13"
dependencies = ["supabase==2.32.0", "python-dotenv==1.2.4", "loguru==0.7.3", "httpx==0.28.1"]

[project.optional-dependencies]
valuation-research = ["numpy==2.3.5", "pandas==2.2.3", "scikit-learn==1.8.0", "catboost==1.2.8", "lightgbm==4.6.0"]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "ruff==0.15.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401"]
